name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"   # weekly: also runs the full upstream suite

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  viraltrack:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image the foundation needs (PostgreSQL 16 + pgvector).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vt
          POSTGRES_PASSWORD: vt
          POSTGRES_DB: vt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vt" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # requirements-dev.lock is `uv pip compile` output; recompiling must change
      # nothing but comments (same check the foundation runs on its lockfile).
      - name: Check the lockfile is current
        run: |
          pip install uv==0.12.15
          uv pip compile -q pyproject.toml --extra dev --universal --python-version 3.10 -o /tmp/lock
          diff <(grep -v '^#' requirements-dev.lock) <(grep -v '^#' /tmp/lock)

      - name: Install
        run: |
          pip install -r requirements-dev.lock
          pip install --no-deps -e .
          pip check

      - name: Lint
        run: ruff check .

      - name: Check configuration (.env.example and compose file)
        run: |
          set -a; . ./.env.example; set +a
          python -m viraltrack.config
          docker compose config -q

      - name: Check the foundation submodule is the pinned commit
        run: test "$(git -C upstream/youtube-niche-finder rev-parse --short=7 HEAD)" = "d872014"

      - name: Tests
        env:
          VT_TEST_DATABASE_URL: postgresql://vt:vt@localhost:5432/vt
          VT_TEST_REQUIRE_PGVECTOR: "1"
        run: pytest -q -p no:cacheprovider

  # The local-development web UI (web/). It needs no database, no foundation and no network service: the
  # tests answer every API call with synthetic responses, and nothing here can reach YouTube.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # pnpm is the version pinned in web/package.json ("packageManager"), provided by Corepack.
      - name: Enable the pinned pnpm
        run: corepack enable

      - name: Install (lockfile only; the lockfile must be current)
        run: pnpm install --frozen-lockfile

      # src/lib/api/schema.d.ts is generated from docs/api/openapi-v1.json; a stale copy fails here.
      - name: Check the API types match the OpenAPI contract
        run: |
          pnpm run api:types
          git diff --exit-code -- src/lib/api/schema.d.ts

      - name: Type check
        run: pnpm exec tsc -b

      - name: Lint
        run: pnpm exec eslint .

      - name: Format check
        run: pnpm exec prettier --check .

      - name: Production build
        run: pnpm run build

      - name: Install the test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests (Vitest in Chromium, with accessibility checks)
        run: pnpm test

      # Production dependencies must have no known advisory. The whole tree must have none of high or
      # critical severity; lower ones in development tooling are listed but do not fail the job.
      - name: Dependency audit
        run: |
          pnpm audit --prod
          pnpm audit --audit-level high
          pnpm audit || true

  # The adopted foundation's own suite, as its CI runs it (pgvector Postgres).
  # Slow (~1,800 tests), so only weekly and on demand.
  upstream-suite:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: niches
          POSTGRES_USER: niches
          POSTGRES_PASSWORD: niches
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U niches" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install foundation dependencies
        run: pip install -r upstream/youtube-niche-finder/backend/requirements.txt pytest
      - name: Upstream tests
        working-directory: upstream/youtube-niche-finder/backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: niches
          POSTGRES_USER: niches
          POSTGRES_PASSWORD: niches
          NICHE_REQUIRE_PGVECTOR: "1"
        run: pytest -q -p no:cacheprovider tests/

  # Phase 3 D1/D2: the tests that run the REAL pinned foundation code offline (synthetic data, YouTube calls
  # faked, no key, no network). A separate job and a separate virtualenv because the foundation pins `anyio`
  # 4.15.1 and ViralTrack's lock pins 4.16.0. Independent of the `viraltrack` job. Design and evidence:
  # docs/phase-3/D1_CI_INTEGRATION_PROPOSAL.md, docs/phase-3/D2_CI_IMPLEMENTATION_REPORT.md and
  # docs/phase-3/CI_HARDENING_REPORT.md. Every multi-line step starts with `set -o pipefail`, so a failing command
  # in front of `tee` cannot be hidden; tests/test_ci_checks.py enforces that.
  discovery-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vt
          POSTGRES_PASSWORD: vt
          POSTGRES_DB: vt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vt" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      VT_TEST_DATABASE_URL: postgresql://vt:vt@localhost:5432/vt
      VT_TEST_REQUIRE_PGVECTOR: "1"
      VT_TEST_REQUIRE_UPSTREAM: "1"
      VT_TEST_UPSTREAM_PYTHON: /tmp/upstream-venv/bin/python
      HF_HUB_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check the foundation submodule is the pinned commit
        run: test "$(git -C upstream/youtube-niche-finder rev-parse --short=7 HEAD)" = "d872014"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            upstream/youtube-niche-finder/backend/requirements.txt

      # Everything is downloaded here, BEFORE the network is cut off.
      - name: Install (ViralTrack environment and a separate foundation environment)
        run: |
          set -o pipefail
          start=$(date +%s)
          python -m venv /tmp/vt-venv
          /tmp/vt-venv/bin/pip install -r requirements-dev.lock
          /tmp/vt-venv/bin/pip install --no-deps -e .
          python -m venv /tmp/upstream-venv
          # Only what the foundation's `api` module imports, at the versions the foundation pins: its pinned
          # file is used as a CONSTRAINTS file (-c), so nothing else is installed and no version is invented.
          # `mcp`, `uvicorn` and `sentry-sdk` are not imported by `api` and are left out. The file is only read.
          /tmp/upstream-venv/bin/pip install \
            -c upstream/youtube-niche-finder/backend/requirements.txt \
            fastapi httpx psycopg2-binary numpy requests python-dotenv langdetect cryptography fastembed pillow
          end=$(date +%s)
          echo "install_seconds=$((end - start))" | tee -a "$GITHUB_STEP_SUMMARY"
          /tmp/upstream-venv/bin/pip list --format=freeze | wc -l | sed 's/^/upstream_environment_packages=/' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          du -sm /tmp/upstream-venv | sed 's/\t.*//; s/^/upstream_environment_mb=/' | tee -a "$GITHUB_STEP_SUMMARY"

      # Fail early, with a clear message, if the reduced install misses something the foundation imports.
      - name: Import smoke test of the foundation (database reachable, network still open)
        env:
          NICHE_DATABASE_URL: postgresql://vt:vt@localhost:5432/vt
          NICHE_DB_SCHEMA: vt_import_smoke
        run: |
          set -o pipefail
          /tmp/upstream-venv/bin/python -c "import sys; sys.path.insert(0, 'upstream/youtube-niche-finder/backend'); import api; print('foundation api imported')"

      # The tests run as a separate, unprivileged user, and the firewall rejects that user's traffic to anything
      # except loopback and the private (docker) ranges the database service container lives in. The rule is
      # scoped by user ID on purpose: a rule for the whole host would also cut off the runner agent, which has to
      # reach GitHub to report the job. No fallback if any of this fails. Each command is timed (`t`), so the
      # slow one is visible in the log.
      - name: Cut off the network for the test user
        run: |
          set -o pipefail
          # t: run a command; print when it started, how long it took and its exit status; keep its status
          t() {
            local begin end rc=0
            begin=$(date +%s.%N)
            "$@" || rc=$?
            end=$(date +%s.%N)
            printf '[%s UTC] %7.2fs rc=%s  %s\n' "$(date -u -d "@${begin%.*}" +%H:%M:%S)" \
              "$(awk -v b="$begin" -v e="$end" 'BEGIN { printf "%.2f", e - b }')" "$rc" "$*"
            return $rc
          }
          total_start=$(date +%s)
          t command -v iptables || { echo "iptables is not available on this runner: network isolation cannot be installed"; exit 1; }
          t command -v ip6tables || { echo "ip6tables is not available on this runner: network isolation cannot be installed"; exit 1; }
          t sudo useradd --create-home --shell /usr/sbin/nologin vtoffline
          t sudo chmod o+x /home/runner /home/runner/work
          t mkdir -p /tmp/vt-offline
          t chmod 777 /tmp/vt-offline
          VT_UID=$(id -u vtoffline)
          VT_GID=$(id -g vtoffline)
          echo "VT_UID=$VT_UID" >> "$GITHUB_ENV"
          echo "VT_GID=$VT_GID" >> "$GITHUB_ENV"
          echo "restricted user: uid=$VT_UID gid=$VT_GID; runner user: uid=$(id -u) gid=$(id -g)"
          test "$VT_UID" != "$(id -u)" || { echo "the restricted user has the runner's uid"; exit 1; }
          t sudo iptables -A OUTPUT -m owner --uid-owner "$VT_UID" -o lo -j ACCEPT
          t sudo iptables -A OUTPUT -m owner --uid-owner "$VT_UID" -d 172.16.0.0/12 -j ACCEPT
          t sudo iptables -A OUTPUT -m owner --uid-owner "$VT_UID" -j REJECT
          # the same for IPv6, so an IPv6 route cannot bypass the rule
          t sudo ip6tables -A OUTPUT -m owner --uid-owner "$VT_UID" -o lo -j ACCEPT
          t sudo ip6tables -A OUTPUT -m owner --uid-owner "$VT_UID" -j REJECT
          echo "--- OUTPUT chains ---"
          sudo iptables -S OUTPUT | tee rules4.txt
          sudo ip6tables -S OUTPUT | tee rules6.txt
          grep -q -- "--uid-owner $VT_UID" rules4.txt || { echo "the IPv4 rules do not match uid $VT_UID"; exit 1; }
          grep -q -- "--uid-owner $VT_UID" rules6.txt || { echo "the IPv6 rules do not match uid $VT_UID"; exit 1; }
          echo "firewall step total: $(( $(date +%s) - total_start ))s"

      - name: Verify the isolation (external traffic fails, the database still works)
        run: |
          set -o pipefail
          echo "runner user, for contrast (informational, not enforced):"
          echo "github.com, runner user: HTTP $(curl -sS -m 10 -o /dev/null -w '%{http_code}' https://github.com || echo unreachable)"
          sudo -u vtoffline id
          sudo -u vtoffline /tmp/vt-venv/bin/python tests/support/ci_checks.py isolation localhost 5432 "$VT_UID" "$VT_GID" | tee isolation.txt
          { echo "### Network isolation (test user)"; echo '```'; cat isolation.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Offline discovery tests (real foundation code, synthetic data), as the isolated user
        run: |
          set -o pipefail
          start=$(date +%s)
          sudo -u vtoffline id
          set +e
          sudo -u vtoffline env \
            "VT_TEST_DATABASE_URL=$VT_TEST_DATABASE_URL" "VT_TEST_REQUIRE_PGVECTOR=$VT_TEST_REQUIRE_PGVECTOR" \
            "VT_TEST_REQUIRE_UPSTREAM=$VT_TEST_REQUIRE_UPSTREAM" "VT_TEST_UPSTREAM_PYTHON=$VT_TEST_UPSTREAM_PYTHON" \
            "HF_HUB_OFFLINE=$HF_HUB_OFFLINE" "PYTHONDONTWRITEBYTECODE=1" \
            "VT_TEST_EXPECT_UID=$VT_UID" "VT_TEST_EXPECT_GID=$VT_GID" \
            /tmp/vt-venv/bin/pytest -p no:cacheprovider -rfEX --junitxml=/tmp/vt-offline/report.xml \
            tests/test_discovery_d1_adapter.py tests/test_discovery_d1_upstream.py \
            tests/test_discovery_d1_policy.py tests/test_collect_period.py tests/test_collect_period_upstream.py
          status=$?
          end=$(date +%s)
          echo "test_seconds=$((end - start))" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

      # Informational only (never fails the job): which rules carried the traffic, how DNS behaves for the test
      # user, where the database container lives, and what the database role may do. It documents the limits
      # of the isolation; it changes nothing.
      - name: Network diagnostics (informational)
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "--- rule counters after the tests (packets and bytes per rule) ---"
            sudo iptables -L OUTPUT -v -n -x || true
            sudo ip6tables -L OUTPUT -v -n -x || true
            echo "--- resolver configuration ---"
            cat /etc/resolv.conf || true
            echo "--- name resolution as the restricted user ---"
            sudo -u vtoffline getent hosts pypi.org || echo "no resolution"
            echo "--- docker networks and the database container ---"
            docker network ls || true
            docker ps --format '{{.ID}} {{.Image}} {{.Ports}}' || true
            for c in $(docker ps -q --filter ancestor=pgvector/pgvector:pg16); do
              docker inspect -f '{{.Name}} {{range $k, $v := .NetworkSettings.Networks}}{{$k}}={{$v.IPAddress}} {{end}}' "$c" || true
            done
            echo "--- listeners on 5432 ---"
            sudo ss -ltnp 2>/dev/null | grep -E ':5432 ' || true
            echo "--- the database role used by the tests ---"
            /tmp/vt-venv/bin/python -c "import os, psycopg2; cur = psycopg2.connect(os.environ['VT_TEST_DATABASE_URL']).cursor(); cur.execute('select rolname, rolsuper, rolcreaterole, rolcreatedb from pg_roles where rolname = current_user'); print(cur.fetchall())" || true
            true
          } 2>&1 | tee diagnostics.txt
          { echo "### Network diagnostics (informational)"; echo '```'; cat diagnostics.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The gate fails on a missing, empty, truncated or malformed report, on a missing summary, on any skip,
      # failure or error, on a wrong file count, and unless exactly the known strict xfails (EXPECTED_XFAILS) are xfailed.
      - name: Enforce collection, skip and xfail rules
        if: always()
        run: |
          set -o pipefail
          status=0
          /tmp/vt-venv/bin/python tests/support/ci_checks.py gate /tmp/vt-offline/report.xml summary.md || status=$?
          if [ -s summary.md ]; then
            tee -a "$GITHUB_STEP_SUMMARY" < summary.md
          else
            echo "no report summary was produced"
            status=1
          fi
          /tmp/vt-venv/bin/python tests/support/ci_checks.py require-summary summary.md || status=$?
          exit $status
