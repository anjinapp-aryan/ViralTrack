name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"   # weekly: also runs the full upstream suite

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  viraltrack:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image the foundation needs (PostgreSQL 16 + pgvector).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vt
          POSTGRES_PASSWORD: vt
          POSTGRES_DB: vt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vt" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # requirements-dev.lock is `uv pip compile` output; recompiling must change
      # nothing but comments (same check the foundation runs on its lockfile).
      - name: Check the lockfile is current
        run: |
          pip install uv==0.12.15
          uv pip compile -q pyproject.toml --extra dev --universal --python-version 3.10 -o /tmp/lock
          diff <(grep -v '^#' requirements-dev.lock) <(grep -v '^#' /tmp/lock)

      - name: Install
        run: |
          pip install -r requirements-dev.lock
          pip install --no-deps -e .
          pip check

      - name: Lint
        run: ruff check .

      - name: Check configuration (.env.example and compose file)
        run: |
          set -a; . ./.env.example; set +a
          python -m viraltrack.config
          docker compose config -q

      - name: Check the foundation submodule is the pinned commit
        run: test "$(git -C upstream/youtube-niche-finder rev-parse --short=7 HEAD)" = "d872014"

      - name: Tests
        env:
          VT_TEST_DATABASE_URL: postgresql://vt:vt@localhost:5432/vt
          VT_TEST_REQUIRE_PGVECTOR: "1"
        run: pytest -q -p no:cacheprovider

  # The adopted foundation's own suite, as its CI runs it (pgvector Postgres).
  # Slow (~1,800 tests), so only weekly and on demand.
  upstream-suite:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: niches
          POSTGRES_USER: niches
          POSTGRES_PASSWORD: niches
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U niches" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install foundation dependencies
        run: pip install -r upstream/youtube-niche-finder/backend/requirements.txt pytest
      - name: Upstream tests
        working-directory: upstream/youtube-niche-finder/backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: niches
          POSTGRES_USER: niches
          POSTGRES_PASSWORD: niches
          NICHE_REQUIRE_PGVECTOR: "1"
        run: pytest -q -p no:cacheprovider tests/

  # Phase 3 D1/D2: the tests that run the REAL pinned foundation code offline (synthetic data, YouTube calls
  # faked, no key, no network). A separate job and a separate virtualenv because the foundation pins `anyio`
  # 4.15.1 and ViralTrack's lock pins 4.16.0. Independent of the `viraltrack` job. Design and evidence:
  # docs/phase-3/D1_CI_INTEGRATION_PROPOSAL.md and docs/phase-3/D2_CI_IMPLEMENTATION_REPORT.md.
  discovery-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vt
          POSTGRES_PASSWORD: vt
          POSTGRES_DB: vt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vt" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      VT_TEST_DATABASE_URL: postgresql://vt:vt@localhost:5432/vt
      VT_TEST_REQUIRE_PGVECTOR: "1"
      VT_TEST_REQUIRE_UPSTREAM: "1"
      VT_TEST_UPSTREAM_PYTHON: /tmp/upstream-venv/bin/python
      HF_HUB_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check the foundation submodule is the pinned commit
        run: test "$(git -C upstream/youtube-niche-finder rev-parse --short=7 HEAD)" = "d872014"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            upstream/youtube-niche-finder/backend/requirements.txt

      # Everything is downloaded here, BEFORE the network is cut off.
      - name: Install (ViralTrack environment and a separate foundation environment)
        run: |
          start=$(date +%s)
          python -m venv /tmp/vt-venv
          /tmp/vt-venv/bin/pip install -r requirements-dev.lock
          /tmp/vt-venv/bin/pip install --no-deps -e .
          python -m venv /tmp/upstream-venv
          # Only what the foundation's `api` module imports, at the versions the foundation pins: its pinned
          # file is used as a CONSTRAINTS file (-c), so nothing else is installed and no version is invented.
          # `mcp`, `uvicorn` and `sentry-sdk` are not imported by `api` and are left out. The file is only read.
          /tmp/upstream-venv/bin/pip install \
            -c upstream/youtube-niche-finder/backend/requirements.txt \
            fastapi httpx psycopg2-binary numpy requests python-dotenv langdetect cryptography fastembed pillow
          end=$(date +%s)
          echo "install_seconds=$((end - start))" | tee -a "$GITHUB_STEP_SUMMARY"
          /tmp/upstream-venv/bin/pip list --format=freeze | wc -l | sed 's/^/upstream_environment_packages=/' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          du -sm /tmp/upstream-venv | sed 's/\t.*//; s/^/upstream_environment_mb=/' | tee -a "$GITHUB_STEP_SUMMARY"

      # Fail early, with a clear message, if the reduced install misses something the foundation imports.
      - name: Import smoke test of the foundation (database reachable, network still open)
        env:
          NICHE_DATABASE_URL: postgresql://vt:vt@localhost:5432/vt
          NICHE_DB_SCHEMA: vt_import_smoke
        run: |
          /tmp/upstream-venv/bin/python -c "import sys; sys.path.insert(0, 'upstream/youtube-niche-finder/backend'); import api; print('foundation api imported')"

      # The tests run as a separate, unprivileged user, and the firewall rejects that user's traffic to anything
      # except loopback and the private (docker) ranges the database service container lives in. The rule is
      # scoped by user ID on purpose: a rule for the whole host would also cut off the runner agent, which has to
      # reach GitHub to report the job. No fallback if any of this fails.
      - name: Cut off the network for the test user
        run: |
          command -v iptables || { echo "iptables is not available on this runner: network isolation cannot be installed"; exit 1; }
          sudo useradd --create-home --shell /usr/sbin/nologin vtoffline
          sudo chmod o+x /home/runner /home/runner/work
          mkdir -p /tmp/vt-offline && chmod 777 /tmp/vt-offline
          sudo iptables -A OUTPUT -m owner --uid-owner vtoffline -o lo -j ACCEPT
          sudo iptables -A OUTPUT -m owner --uid-owner vtoffline -d 172.16.0.0/12 -j ACCEPT
          sudo iptables -A OUTPUT -m owner --uid-owner vtoffline -j REJECT
          # the same for IPv6, so an IPv6 route cannot bypass the rule
          command -v ip6tables || { echo "ip6tables is not available on this runner"; exit 1; }
          sudo ip6tables -A OUTPUT -m owner --uid-owner vtoffline -o lo -j ACCEPT
          sudo ip6tables -A OUTPUT -m owner --uid-owner vtoffline -j REJECT
          echo "--- OUTPUT chain ---"
          sudo iptables -S OUTPUT
          sudo ip6tables -S OUTPUT

      - name: Verify the isolation (external traffic fails, the database still works)
        run: |
          echo "runner user, for contrast (informational, not enforced):"
          echo "github.com, runner user: HTTP $(curl -sS -m 10 -o /dev/null -w '%{http_code}' https://github.com || echo unreachable)"
          sudo -u vtoffline /tmp/vt-venv/bin/python tests/support/ci_checks.py isolation localhost 5432 | tee isolation.txt
          { echo "### Network isolation (test user)"; echo '```'; cat isolation.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Offline discovery tests (real foundation code, synthetic data), as the isolated user
        run: |
          start=$(date +%s)
          set +e
          sudo -u vtoffline env \
            "VT_TEST_DATABASE_URL=$VT_TEST_DATABASE_URL" "VT_TEST_REQUIRE_PGVECTOR=$VT_TEST_REQUIRE_PGVECTOR" \
            "VT_TEST_REQUIRE_UPSTREAM=$VT_TEST_REQUIRE_UPSTREAM" "VT_TEST_UPSTREAM_PYTHON=$VT_TEST_UPSTREAM_PYTHON" \
            "HF_HUB_OFFLINE=$HF_HUB_OFFLINE" "PYTHONDONTWRITEBYTECODE=1" \
            /tmp/vt-venv/bin/pytest -p no:cacheprovider -rfEX --junitxml=/tmp/vt-offline/report.xml \
            tests/test_discovery_d1_adapter.py tests/test_discovery_d1_upstream.py \
            tests/test_discovery_d1_policy.py tests/test_collect_period.py tests/test_collect_period_upstream.py
          status=$?
          end=$(date +%s)
          echo "test_seconds=$((end - start))" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Enforce collection and skip rules
        if: always()
        run: |
          test -f /tmp/vt-offline/report.xml || { echo "no test report was produced"; exit 1; }
          /tmp/vt-venv/bin/python tests/support/ci_checks.py report /tmp/vt-offline/report.xml | tee summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          ! grep -q "PROBLEM" summary.md
