# ViralTrack local stack.
#
# The YouTube foundation's own compose file is reused unchanged through
# `include` (postgres, web, worker, mcp...). ViralTrack adds only the
# retention service that enforces docs/phase-1/DATA_RETENTION_POLICY.md.
#
#   cp upstream/youtube-niche-finder/.env.example upstream/youtube-niche-finder/.env
#   #   (put YOUTUBE_API_KEY there)
#   cp .env.example .env
#   docker compose up -d postgres web worker retention
#
# Dashboard: http://localhost:8080  (the foundation's `web` service)

# The include lists two files: compose merges the second over the first (compose spec, "include"
# with several paths). The thumbnail-safe ingestion profile is therefore part of the default stack;
# no `-f` flag and no variable has to be remembered. See docs/phase-2/INGESTION_PROFILE.md.
include:
  - path:
      - upstream/youtube-niche-finder/docker-compose.yml
      - deploy/compose.ingestion-profile.yml

services:
  retention:
    build: .
    image: viraltrack:latest
    # No env_file: the root .env also holds YOUTUBE_API_KEY, which retention never needs. Only the
    # variables below reach the container (an unset one arrives blank and means "default").
    environment:
      VT_ENV: "${VT_ENV:-}"
      VT_LOG_LEVEL: "${VT_LOG_LEVEL:-}"
      VT_RETENTION_APPLY: "${VT_RETENTION_APPLY:-}"
      VT_RETENTION_YOUTUBE_STATS_DAYS: "${VT_RETENTION_YOUTUBE_STATS_DAYS:-}"
      VT_RETENTION_YOUTUBE_TEXT_DAYS: "${VT_RETENTION_YOUTUBE_TEXT_DAYS:-}"
      VT_YOUTUBE_ANALYTICS_AMENDMENT_ACCEPTED: "${VT_YOUTUBE_ANALYTICS_AMENDMENT_ACCEPTED:-}"
      VT_TRANSCRIPTS_APPROVED: "${VT_TRANSCRIPTS_APPROVED:-}"
      VT_THUMBNAILS_APPROVED: "${VT_THUMBNAILS_APPROVED:-}"
      DATABASE_SSL_MODE: "${DATABASE_SSL_MODE:-}"
      DATABASE_CONNECT_TIMEOUT: "${DATABASE_CONNECT_TIMEOUT:-}"
      DATABASE_STATEMENT_TIMEOUT: "${DATABASE_STATEMENT_TIMEOUT:-}"
      DATABASE_APPLICATION_NAME: "${DATABASE_APPLICATION_NAME:-}"
      # The foundation's database. Default: the compose `postgres` service. Set DATABASE_URL
      # (and DATABASE_PROVIDER) in .env for a managed database; see .env.example.
      DATABASE_PROVIDER: "${DATABASE_PROVIDER:-local}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://${POSTGRES_USER:-niches}:${POSTGRES_PASSWORD:-niches}@postgres:5432/${POSTGRES_DB:-niches}}"
      DATABASE_SCHEMA: "${DATABASE_SCHEMA:-public}"
      # Earlier spellings, blanked so a stale .env value cannot conflict with the above.
      VT_DATABASE_URL: ""
      VT_DATABASE_SCHEMA: ""
    # Daily: delete what the policy no longer allows to keep. Runs once at start;
    # a failed run is retried after 10 minutes instead of waiting a day.
    command: ["sh", "-c", "while true; do if python -m viraltrack.retention --apply; then sleep 86400; else sleep 600; fi; done"]
    restart: unless-stopped
    depends_on:
      # `web` creates and migrates the schema at start; retention must not run before it.
      web:
        condition: service_healthy
